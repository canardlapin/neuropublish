<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neuropublish</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0d0f14; color: #e6e8ee; }
      .revision { padding: 24px; }
      .meta, .status { color: #8b93a7; font-family: ui-monospace, monospace; font-size: 13px; }
      .workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; margin-top: 16px; }
      .navigator h2 { font-size: 14px; color: #8b93a7; text-transform: uppercase; letter-spacing: .06em; }
      .layer { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #232838; }
      .layer-name { flex: 1; }
      .canvas-host { height: 520px; background: #05060a; border: 1px solid #232838; border-radius: 8px; }
      .warning { color: #e5a33b; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
