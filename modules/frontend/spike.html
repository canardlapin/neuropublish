<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Neuropublish lifecycle spike</title>
    <style>body{margin:0} .host{width:320px;height:240px;border:1px solid #888;margin:8px;display:inline-block}</style>
  </head>
  <body>
    <div id="vol" class="host"></div>
    <div id="surf" class="host"></div>
    <div id="sentinel" class="host"></div>
    <script type="module">
      // Count every listener registration on every EventTarget (canvas, window, document, ...).
      const counts = { add: 0, remove: 0 };
      const proto = EventTarget.prototype;
      const origAdd = proto.addEventListener, origRemove = proto.removeEventListener;
      proto.addEventListener = function (...a) { counts.add++; return origAdd.apply(this, a); };
      proto.removeEventListener = function (...a) { counts.remove++; return origRemove.apply(this, a); };
      const THREE = await import("three");
      const app = await import("./main.js");
      window.__spike = {
        mountVolume: (id) => app.spikeMountVolume(id),
        mountSurface: (id) => app.spikeMountSurface(id, THREE),
        unmount: (id) => app.spikeUnmount(id),
        contextState: (id) => app.spikeSurfaceContextState(id),
        link: (id, x, y, z) => app.spikeSurfaceLink(id, x, y, z),
        pick: (id, x, y) => app.spikeSurfacePick(id, x, y),
        report: () => ({ ...app.spikeReport(), listeners: { ...counts } }),
        resize: (id, w, h) => { const el = document.getElementById(id); el.style.width = w + "px"; el.style.height = h + "px"; },
      };
      window.__spikeReady = true;
    </script>
  </body>
</html>
